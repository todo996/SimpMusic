name: SimpMusicNative
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.maxrave.simpmusic.native
    PRODUCT_NAME: SimpMusicNative
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  SimpMusicNative:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: SimpMusicNative
    settings:
      base:
        INFOPLIST_FILE: SimpMusicNative/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    scheme:
      gatherCoverageData: false
