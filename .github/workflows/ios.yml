name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [ios-port]

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: microsoft
          cache: gradle

      - name: Enable iOS targets
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path("composeApp/build.gradle.kts")
          s = p.read_text()
          old = """//    listOf(
          //        iosArm64(),
          //        iosSimulatorArm64()
          //    ).forEach { iosTarget ->
          //        iosTarget.binaries.framework {
          //            baseName = \"ComposeApp\"
          //            isStatic = true
          //        }
          //    }"""
          new = """    listOf(
                  iosArm64(),
                  iosSimulatorArm64()
              ).forEach { iosTarget ->
                  iosTarget.binaries.framework {
                      baseName = \"ComposeApp\"
                      isStatic = true
                  }
              }"""
          if old not in s:
              raise SystemExit("iOS target block not found")
          p.write_text(s.replace(old, new))
          PY

      - name: Generate library metadata
        run: ./gradlew exportLibraryDefinitions

      - name: Build simulator framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Build device framework
        run: ./gradlew :composeApp:linkReleaseFrameworkIosArm64 --stacktrace

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd iosApp
          xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild -project iosApp/SimpMusic.xcodeproj -scheme SimpMusic -configuration Release -sdk iphoneos -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Package IPA
        run: |
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/SimpMusic.app build/Payload/
          cd build
          zip -qry SimpMusic-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: SimpMusic-iOS-unsigned
          path: build/SimpMusic-unsigned.ipa
