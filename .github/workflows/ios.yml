name: Build iOS

on:
  workflow_dispatch:
  push:
    branches:
      - 'ios-port'

jobs:
  framework:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Enable iOS targets for port branch
        shell: python3 {0}
        run: |
          from pathlib import Path
          p = Path('composeApp/build.gradle.kts')
          s = p.read_text()
          old = '''//    listOf(
//        iosArm64(),
//        iosSimulatorArm64()
//    ).forEach { iosTarget ->
//        iosTarget.binaries.framework {
//            baseName = "ComposeApp"
//            isStatic = true
//        }
//    }'''
          new = '''    listOf(
        iosArm64(),
        iosSimulatorArm64()
    ).forEach { iosTarget ->
        iosTarget.binaries.framework {
            baseName = "ComposeApp"
            isStatic = true
        }
    }'''
          if old not in s:
              raise SystemExit('iOS target block not found')
          p.write_text(s.replace(old, new))

      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions

      - name: Build iOS simulator framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Upload iOS framework
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ComposeApp-iOS-Simulator
          path: composeApp/build/bin/iosSimulatorArm64/debugFramework/ComposeApp.framework
