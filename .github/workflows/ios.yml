name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [ios-port]

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: microsoft
          cache: gradle

      - name: Audit and prepare iOS KMP sources
        run: |
          python3 scripts/ios/prepare_kmp.py
          python3 scripts/ios/prepare_compose_kmp.py

      - name: Compile core for iOS simulator
        run: |
          ./gradlew \
            :common:compileKotlinIosSimulatorArm64 \
            :domain:compileKotlinIosSimulatorArm64 \
            :data:compileKotlinIosSimulatorArm64 \
            --stacktrace --no-configuration-cache

      - name: Build simulator framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace --no-configuration-cache

      - name: Build device framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosArm64 --stacktrace --no-configuration-cache

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd iosApp
          xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild -project iosApp/SimpMusic.xcodeproj -scheme SimpMusic -configuration Debug -sdk iphoneos -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Package IPA
        run: |
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R build/ios/Build/Products/Debug-iphoneos/SimpMusic.app build/Payload/
          cd build
          zip -qry SimpMusic-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: SimpMusic-iOS-unsigned
          path: build/SimpMusic-unsigned.ipa
