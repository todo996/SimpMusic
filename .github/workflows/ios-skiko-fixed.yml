name: Build iOS - Fast Device IPA

on:
  workflow_dispatch:
  push:
    branches:
      - ios-skiko-uri-fix-20260910

concurrency:
  group: ios-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-fast:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Select Xcode 16.4 for iOS 18
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "18.5"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: microsoft

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ios-fast-gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: |
            ios-fast-gradle-${{ runner.os }}-
          save-always: true

      - name: Cache Kotlin Native toolchains
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ios-fast-konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'scripts/ios/*.py') }}
          restore-keys: |
            ios-fast-konan-${{ runner.os }}-
            ios-fixed-konan-${{ runner.os }}-
          save-always: true

      - name: Prepare KMP sources and pin Compose-Skiko ABI
        run: |
          set -euo pipefail
          git -C core apply --whitespace=nowarn ../scripts/ios/core_override.patch
          git -C core apply --whitespace=nowarn ../scripts/ios/core_crypto_override.patch
          git -C core apply --whitespace=nowarn ../scripts/ios/core_avplayer_override.patch
          git -C core apply --whitespace=nowarn ../scripts/ios/core_rate_override.patch
          git -C core apply --whitespace=nowarn ../scripts/ios/core_cache_override.patch
          python3 scripts/ios/prepare_kmp.py
          python3 scripts/ios/prepare_compose_kmp.py

          cat >> composeApp/build.gradle.kts <<'KOTLIN'

          // IOS_SKIKO_ABI_GUARD_20260910
          configurations.configureEach {
              resolutionStrategy.eachDependency {
                  when (requested.group) {
                      "org.jetbrains.skiko" -> {
                          useVersion("0.9.37.4")
                          because("Compose Multiplatform 1.10.3 iOS ABI requires matching Skiko")
                      }
                      "org.jetbrains.compose.components" -> {
                          useVersion("1.10.3")
                          because("Compose resources must match Compose UI 1.10.3 on iOS")
                      }
                  }
              }
          }
          KOTLIN
          grep -q 'IOS_SKIKO_ABI_GUARD_20260910' composeApp/build.gradle.kts
          echo 'Compose/Skiko ABI guard installed.'

      - name: Restore cached iPhone framework
        id: framework-cache
        uses: actions/cache@v4
        with:
          path: |
            composeApp/build/bin/iosArm64/debugFramework
            composeApp/build/generated/compose/resourceGenerator/preparedResources
          key: ios-arm64-framework-v2-${{ runner.os }}-${{ hashFiles('composeApp/src/**/*.kt', 'common/src/**/*.kt', 'domain/src/**/*.kt', 'data/src/**/*.kt', 'core/**/*.kt', '**/*.gradle.kts', 'gradle/libs.versions.toml', 'scripts/ios/**') }}
          save-always: true

      - name: Link iPhone ARM64 framework
        if: steps.framework-cache.outputs.cache-hit != 'true'
        run: |
          ./gradlew :composeApp:linkDebugFrameworkIosArm64 \
            --stacktrace --no-configuration-cache --build-cache --parallel

      - name: Verify device framework ABI
        run: |
          set -euo pipefail
          FRAMEWORK=composeApp/build/bin/iosArm64/debugFramework/ComposeApp.framework/ComposeApp
          test -f "$FRAMEWORK"
          file "$FRAMEWORK" | tee build-framework-file.txt
          ARCHS=$(xcrun lipo -archs "$FRAMEWORK")
          echo "Framework architectures: $ARCHS" | tee build-framework-archs.txt
          if ! printf '%s\n' "$ARCHS" | tr ' ' '\n' | grep -qx 'arm64'; then
            echo 'ERROR: static ComposeApp.framework archive does not contain arm64'
            exit 1
          fi
          python3 - "$FRAMEWORK" <<'PY'
          from pathlib import Path
          import sys
          binary = Path(sys.argv[1]).read_bytes()
          uri = b'org.jetbrains.skiko/URIManager'
          linkage = b'unlinked class symbol'
          pos = binary.find(uri)
          if pos >= 0 and linkage in binary[max(0, pos - 4096):pos + 4096]:
              raise SystemExit('Known fatal URIManager IrLinkageError stub remains')
          if b"Variable uses unlinked class symbol 'org.jetbrains.skiko/URIManager'" in binary:
              raise SystemExit('Exact build-60 URIManager crash signature remains')
          print('Known URIManager crash signature is absent.')
          PY
          if nm -u "$FRAMEWORK" | grep -q '_OBJC_CLASS_\$_UIViewLayoutRegion'; then
            echo 'ERROR: framework references iOS 26-only UIViewLayoutRegion'
            exit 1
          fi
          echo 'Device framework ABI checks passed.'

      - name: Locate Compose iOS resources
        run: |
          set -euo pipefail
          RESOURCE_FILE=$(find "$GITHUB_WORKSPACE/composeApp/build" -type f \
            -path '*/preparedResources/commonMain/composeResources/values/strings.commonMain.cvr' \
            -print -quit)
          if [ -z "$RESOURCE_FILE" ]; then
            ./gradlew :composeApp:generateComposeResClass --no-configuration-cache --build-cache || true
            RESOURCE_FILE=$(find "$GITHUB_WORKSPACE/composeApp/build" -type f \
              -path '*/preparedResources/commonMain/composeResources/values/strings.commonMain.cvr' \
              -print -quit)
          fi
          if [ -z "$RESOURCE_FILE" ]; then
            echo 'ERROR: strings.commonMain.cvr was not found'
            exit 1
          fi
          SOURCE_RESOURCE_ROOT=$(dirname "$(dirname "$RESOURCE_FILE")")
          STAGED_RESOURCE_ROOT="$GITHUB_WORKSPACE/build/ios-compose-resources/composeResources/simpmusic.composeapp.generated.resources"
          mkdir -p "$STAGED_RESOURCE_ROOT"
          cp -R "$SOURCE_RESOURCE_ROOT/." "$STAGED_RESOURCE_ROOT/"
          test -f "$STAGED_RESOURCE_ROOT/values/strings.commonMain.cvr"
          echo "COMPOSE_RESOURCE_ROOT=$GITHUB_WORKSPACE/build/ios-compose-resources" >> "$GITHUB_ENV"

      - name: Generate iOS app icon assets
        run: |
          set -euo pipefail
          SRC=androidApp/src/main/res/mipmap-xxxhdpi/ic_launcher.webp
          SET=iosApp/Assets.xcassets/AppIcon.appiconset
          mkdir -p "$SET"
          make_icon() { sips -s format png -z "$1" "$1" "$SRC" --out "$SET/$2" >/dev/null; }
          make_icon 40 icon-20@2x.png
          make_icon 60 icon-20@3x.png
          make_icon 58 icon-29@2x.png
          make_icon 87 icon-29@3x.png
          make_icon 80 icon-40@2x.png
          make_icon 120 icon-40@3x.png
          make_icon 120 icon-60@2x.png
          make_icon 180 icon-60@3x.png
          make_icon 20 icon-20-ipad.png
          make_icon 40 icon-20-ipad@2x.png
          make_icon 29 icon-29-ipad.png
          make_icon 58 icon-29-ipad@2x.png
          make_icon 40 icon-40-ipad.png
          make_icon 80 icon-40-ipad@2x.png
          make_icon 76 icon-76-ipad.png
          make_icon 152 icon-76-ipad@2x.png
          make_icon 167 icon-83.5-ipad@2x.png
          make_icon 1024 icon-marketing.png
          cat > "$SET/Contents.json" <<'JSON'
          {"images":[
            {"filename":"icon-20@2x.png","idiom":"iphone","scale":"2x","size":"20x20"},
            {"filename":"icon-20@3x.png","idiom":"iphone","scale":"3x","size":"20x20"},
            {"filename":"icon-29@2x.png","idiom":"iphone","scale":"2x","size":"29x29"},
            {"filename":"icon-29@3x.png","idiom":"iphone","scale":"3x","size":"29x29"},
            {"filename":"icon-40@2x.png","idiom":"iphone","scale":"2x","size":"40x40"},
            {"filename":"icon-40@3x.png","idiom":"iphone","scale":"3x","size":"40x40"},
            {"filename":"icon-60@2x.png","idiom":"iphone","scale":"2x","size":"60x60"},
            {"filename":"icon-60@3x.png","idiom":"iphone","scale":"3x","size":"60x60"},
            {"filename":"icon-20-ipad.png","idiom":"ipad","scale":"1x","size":"20x20"},
            {"filename":"icon-20-ipad@2x.png","idiom":"ipad","scale":"2x","size":"20x20"},
            {"filename":"icon-29-ipad.png","idiom":"ipad","scale":"1x","size":"29x29"},
            {"filename":"icon-29-ipad@2x.png","idiom":"ipad","scale":"2x","size":"29x29"},
            {"filename":"icon-40-ipad.png","idiom":"ipad","scale":"1x","size":"40x40"},
            {"filename":"icon-40-ipad@2x.png","idiom":"ipad","scale":"2x","size":"40x40"},
            {"filename":"icon-76-ipad.png","idiom":"ipad","scale":"1x","size":"76x76"},
            {"filename":"icon-76-ipad@2x.png","idiom":"ipad","scale":"2x","size":"76x76"},
            {"filename":"icon-83.5-ipad@2x.png","idiom":"ipad","scale":"2x","size":"83.5x83.5"},
            {"filename":"icon-marketing.png","idiom":"ios-marketing","scale":"1x","size":"1024x1024"}
          ],"info":{"author":"xcode","version":1}}
          JSON

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate device Xcode project
        run: |
          cd iosApp
          xcodegen generate

      - name: Build unsigned iPhone app - build 62
        run: |
          xcodebuild \
            -project iosApp/SimpMusic.xcodeproj \
            -scheme SimpMusic \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION=2.1.2 \
            CURRENT_PROJECT_VERSION=62 \
            ENABLE_DEBUG_DYLIB=NO \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            build

      - name: Verify final iPhone app
        run: |
          set -euo pipefail
          APP=build/ios/Build/Products/Debug-iphoneos/SimpMusic.app
          BIN="$APP/SimpMusic"
          test -x "$BIN"
          test -f "$APP/Info.plist"
          mkdir -p "$APP/compose-resources"
          cp -R "$COMPOSE_RESOURCE_ROOT/composeResources" "$APP/compose-resources/"
          test -f "$APP/compose-resources/composeResources/simpmusic.composeapp.generated.resources/values/strings.commonMain.cvr"

          SHORT_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          BUILD_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          test "$SHORT_VERSION" = '2.1.2'
          test "$BUILD_VERSION" = '62'

          python3 - "$BIN" <<'PY'
          from pathlib import Path
          import sys
          binary = Path(sys.argv[1]).read_bytes()
          uri = b'org.jetbrains.skiko/URIManager'
          linkage = b'unlinked class symbol'
          pos = binary.find(uri)
          if pos >= 0 and linkage in binary[max(0, pos - 4096):pos + 4096]:
              raise SystemExit('Final executable still contains the known URIManager IrLinkageError stub')
          if b"Variable uses unlinked class symbol 'org.jetbrains.skiko/URIManager'" in binary:
              raise SystemExit('Final executable contains exact fatal linkage message from build 60')
          print('Final executable is free of the known URIManager crash signature.')
          PY

          if ! file "$BIN" | grep -q 'arm64'; then
            echo 'ERROR: final executable is not ARM64'
            exit 1
          fi
          if otool -L "$BIN" | grep -q '@rpath/SimpMusic.debug.dylib'; then
            echo 'ERROR: final app depends on Xcode debug dylib'
            exit 1
          fi
          if [[ -e "$APP/SimpMusic.debug.dylib" ]]; then
            echo 'ERROR: Xcode debug dylib was packaged'
            exit 1
          fi
          file "$BIN"
          dwarfdump --uuid "$BIN" | tee build/final-macho-uuid.txt
          echo "Version: $SHORT_VERSION ($BUILD_VERSION)" | tee build/final-version.txt
          shasum -a 256 "$BIN" | tee build/final-binary-sha256.txt
          echo 'Final iPhone verification passed.'

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R build/ios/Build/Products/Debug-iphoneos/SimpMusic.app build/Payload/
          (cd build && zip -qry SimpMusic-2.1.2-build62-iOS18-FastFixed-unsigned.ipa Payload)
          shasum -a 256 build/SimpMusic-2.1.2-build62-iOS18-FastFixed-unsigned.ipa | tee build/final-ipa-sha256.txt

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SimpMusic-iOS18-FastFixed-build62
          path: build/SimpMusic-2.1.2-build62-iOS18-FastFixed-unsigned.ipa
          if-no-files-found: error

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SimpMusic-iOS18-FastFixed-verification-${{ github.run_number }}
          path: |
            build-framework-file.txt
            build-framework-archs.txt
            build/final-macho-uuid.txt
            build/final-version.txt
            build/final-binary-sha256.txt
            build/final-ipa-sha256.txt
          if-no-files-found: ignore
