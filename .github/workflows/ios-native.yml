name: iOS Native Rewrite

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-native:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate native Xcode project
        run: |
          set -euo pipefail
          cd iosNative
          xcodegen generate
          test -f SimpMusicNative.xcodeproj/project.pbxproj

      - name: Build simulator app
        run: |
          set -euo pipefail
          xcodebuild \
            -project iosNative/SimpMusicNative.xcodeproj \
            -scheme SimpMusicNative \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-native-simulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          test -x build/ios-native-simulator/Build/Products/Release-iphonesimulator/SimpMusicNative.app/SimpMusicNative

      - name: Simulator startup smoke test
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import signal
          import subprocess
          import sys
          import time
          from pathlib import Path

          bundle_id = "com.maxrave.simpmusic.native"
          app_path = "build/ios-native-simulator/Build/Products/Release-iphonesimulator/SimpMusicNative.app"

          def run_bounded(command, timeout):
              process = subprocess.Popen(
                  command,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
                  start_new_session=True,
              )
              try:
                  output, _ = process.communicate(timeout=timeout)
                  return process.returncode, output
              except subprocess.TimeoutExpired:
                  try:
                      os.killpg(process.pid, signal.SIGKILL)
                  except ProcessLookupError:
                      pass
                  output, _ = process.communicate(timeout=5)
                  return 124, (output or "") + "\nCOMMAND TIMED OUT\n"

          list_status, list_output = run_bounded(
              ["xcrun", "simctl", "list", "devices", "available", "-j"], 30
          )
          if list_status != 0:
              raise SystemExit("simctl list devices failed or timed out:\n" + list_output)
          devices = json.loads(list_output)["devices"]
          device = next(
              device
              for runtimes in devices.values()
              for device in runtimes
              if device["isAvailable"] and device["name"].startswith("iPhone")
          )
          device_id = device["udid"]
          if device["state"] != "Booted":
              boot_status, boot_output = run_bounded(["xcrun", "simctl", "boot", device_id], 30)
              if boot_status not in (0, 149):
                  print("simctl boot returned", boot_status)
                  print(boot_output)
              ready_status, ready_output = run_bounded(
                  ["xcrun", "simctl", "bootstatus", device_id, "-b"], 180
              )
              if ready_status != 0:
                  raise SystemExit("simctl bootstatus failed or timed out:\n" + ready_output)

          install_status, install_output = run_bounded(
              ["xcrun", "simctl", "install", device_id, app_path], 180
          )
          Path("build/ios-native-install.log").write_text(install_output or "", encoding="utf-8")
          if install_status != 0:
              raise SystemExit("simctl install failed or timed out:\n" + install_output)

          launch_status, launch_output = run_bounded(
              ["xcrun", "simctl", "launch", "--console", device_id, bundle_id], 30
          )
          Path("build/ios-native-launch.log").write_text(launch_output or "", encoding="utf-8")
          time.sleep(8)
          probe_status, probe_output = run_bounded(
              ["xcrun", "simctl", "spawn", device_id, "launchctl", "list"], 30
          )
          Path("build/ios-native-probe.log").write_text(probe_output or "", encoding="utf-8")
          if probe_status != 0 or bundle_id not in probe_output:
              print(f"Native iOS app is not alive after launch (simctl status: {launch_status})")
              print(launch_output)
              print(probe_output)
              sys.exit(1)
          print(f"Native iOS startup smoke passed (simctl status: {launch_status}).")
          PY

      - name: Build device app
        run: |
          set -euo pipefail
          xcodebuild \
            -project iosNative/SimpMusicNative.xcodeproj \
            -scheme SimpMusicNative \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-native-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          test -x build/ios-native-device/Build/Products/Release-iphoneos/SimpMusicNative.app/SimpMusicNative

      - name: Package and verify unsigned IPA
        run: |
          set -euo pipefail
          DEVICE_APP=build/ios-native-device/Build/Products/Release-iphoneos/SimpMusicNative.app
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$DEVICE_APP/Info.plist")
          APP_EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$DEVICE_APP/Info.plist")
          test "$APP_ID" = 'com.maxrave.simpmusic.native'
          test "$APP_EXECUTABLE" = 'SimpMusicNative'
          test -f "$DEVICE_APP/Info.plist"
          mkdir -p build/ios-native-package/Payload
          cp -R "$DEVICE_APP" build/ios-native-package/Payload/
          (cd build/ios-native-package && zip -qry ../SimpMusicNative-unsigned.ipa Payload)
          unzip -l build/SimpMusicNative-unsigned.ipa | grep -F 'Payload/SimpMusicNative.app/Info.plist'
          unzip -l build/SimpMusicNative-unsigned.ipa | grep -F 'Payload/SimpMusicNative.app/SimpMusicNative'
          shasum -a 256 build/SimpMusicNative-unsigned.ipa | tee build/SimpMusicNative-unsigned.ipa.sha256

      - name: Upload native IPA
        uses: actions/upload-artifact@v4
        with:
          name: SimpMusicNative-iOS-unsigned
          path: |
            build/SimpMusicNative-unsigned.ipa
            build/SimpMusicNative-unsigned.ipa.sha256
          if-no-files-found: error

      - name: Upload native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SimpMusicNative-iOS-diagnostics
          path: |
            build/ios-native-launch.log
            build/ios-native-probe.log
            build/ios-native-install.log
          if-no-files-found: ignore
